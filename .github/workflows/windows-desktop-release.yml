name: Windows desktop release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - run: npm test
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0.x'
      - name: Build, smoke test, and package Windows x64
        id: package
        shell: pwsh
        run: |
          $version = "1.0.$env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT"
          ./packaging/Build-Windows.ps1 -RuntimeIdentifier win-x64 -Version $version
          ./packaging/Smoke-Test.ps1 -ReleaseRoot release

          $zipName = 'D2Checkpoint-Windows-x64.zip'
          $zip = Join-Path $env:RUNNER_TEMP $zipName
          $release = (Resolve-Path -LiteralPath release).Path
          [IO.Compression.ZipFile]::CreateFromDirectory($release, $zip, [IO.Compression.CompressionLevel]::Optimal, $false)
          $digest = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$zip.sha256" -Value "$digest  $zipName" -Encoding ascii
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: desktop-${{ steps.package.outputs.version }}
          path: |
            ${{ runner.temp }}/D2Checkpoint-Windows-x64.zip
            ${{ runner.temp }}/D2Checkpoint-Windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # Keep release checks and creation serialized. Queue order can differ from version order.
    concurrency:
      group: windows-desktop-release
      queue: max
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          # A publish-only rerun uses the version and assets from its successful build.
          name: desktop-${{ needs.build.outputs.version }}
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $version = [version]$env:RELEASE_VERSION
          $tag = "desktop-v$version"
          $repoApi = "repos/$env:GITHUB_REPOSITORY"
          $releases = gh api "$repoApi/releases?per_page=100" --paginate --jq '.[] | select(.draft or (.prerelease | not)) | [.tag_name, .draft] | @tsv'
          foreach ($release in $releases) {
            $releaseTag, $draft = $release -split "`t", 2
            if ($draft -eq 'true') {
              if ($releaseTag -eq $tag) { throw "A draft for $tag already exists. Rerun all jobs to build a new version." }
              continue
            }
            if ($releaseTag -match '^desktop-v([0-9]+(?:\.[0-9]+){3})$' -and ($Matches[1] -as [version]) -ge $version) {
              Write-Host "Skipping $tag because $releaseTag is already published."
              exit 0
            }
          }

          $existingRefs = gh api "$repoApi/git/matching-refs/tags/$tag" --jq '.[].ref'
          if ($existingRefs -contains "refs/tags/$tag") { throw "The tag $tag already exists." }
          $mainSha = gh api "$repoApi/git/ref/heads/main" --jq '.object.sha'
          if ($mainSha -ne $env:GITHUB_SHA) {
            Write-Host "Skipping $tag because main has advanced."
            exit 0
          }

          $zip = 'D2Checkpoint-Windows-x64.zip'
          gh release create $tag $zip "$zip.sha256" --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA --title "D2Checkpoint $version" --generate-notes --draft

          # Recheck main after uploading both assets, immediately before publishing.
          $mainSha = gh api "$repoApi/git/ref/heads/main" --jq '.object.sha'
          if ($mainSha -ne $env:GITHUB_SHA) {
            Write-Host "Leaving $tag as a draft because main advanced during upload."
            exit 0
          }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
